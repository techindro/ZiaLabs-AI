<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#skyGrad)"/>

  <g opacity="0.15" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <path d="M 200,320 Q 400,200 600,320 L 600,380 L 200,380 Z" fill="url(#accentGrad)" opacity="0.3"/>
  <path d="M 220,310 Q 400,180 580,310" stroke="url(#accentGrad)" stroke-width="4" fill="none"/>

  <g opacity="0.7">
    <rect x="120" y="160" width="160" height="200" fill="#1b2a38" stroke="#00c6ff" stroke-width="1.5"/>
    <rect x="520" y="160" width="160" height="200" fill="#1b2a38" stroke="#00c6ff" stroke-width="1.5"/>
    <rect x="280" y="120" width="240" height="240" fill="#111e2e" stroke="#00c6ff" stroke-width="2"/>
  </g>

  <g fill="#00c6ff" opacity="0.6">
    <rect x="300" y="140" width="20" height="30" rx="2"/>
    <rect x="335" y="140" width="20" height="30" rx="2"/>
    <rect x="370" y="140" width="20" height="30" rx="2"/>
    <rect x="405" y="140" width="20" height="30" rx="2"/>
    <rect x="440" y="140" width="20" height="30" rx="2"/>
    <rect x="475" y="140" width="20" height="30" rx="2"/>

    <rect x="300" y="185" width="20" height="30" rx="2"/>
    <rect x="335" y="185" width="20" height="30" rx="2"/>
    <rect x="370" y="185" width="20" height="30" rx="2"/>
    <rect x="405" y="185" width="20" height="30" rx="2"/>
    <rect x="440" y="185" width="20" height="30" rx="2"/>
    <rect x="475" y="185" width="20" height="30" rx="2"/>

    <rect x="300" y="230" width="20" height="30" rx="2"/>
    <rect x="335" y="230" width="20" height="30" rx="2"/>
    <rect x="370" y="230" width="20" height="30" rx="2"/>
    <rect x="405" y="230" width="20" height="30" rx="2"/>
    <rect x="440" y="230" width="20" height="30" rx="2"/>
    <rect x="475" y="230" width="20" height="30" rx="2"/>
  </g>

  <rect x="0" y="360" width="800" height="90" fill="#0d1921"/>
  <rect x="0" y="358" width="800" height="4" fill="url(#accentGrad)"/>

  <g transform="translate(50, 40)">
    <rect width="180" height="38" rx="19" fill="rgba(0,0,0,0.6)" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <text x="90" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">IIT DELHI CAMPUS</text>
  </g>
