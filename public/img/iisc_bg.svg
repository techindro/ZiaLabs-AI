<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iisc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0c2e"/>
      <stop offset="50%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#0e061a"/>
    </linearGradient>
    <radialGradient id="iisc-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#iisc-bg)"/>
  <circle cx="400" cy="225" r="280" fill="url(#iisc-glow)"/>

  <!-- Quantum Spiking Circuit Lines -->
  <g stroke="#a78bfa" stroke-opacity="0.2" stroke-width="1.5" fill="none">
    <path d="M 100 225 Q 250 100 400 225 T 700 225"/>
    <path d="M 100 225 Q 250 350 400 225 T 700 225"/>
    <circle cx="250" cy="162" r="4" fill="#a78bfa"/>
    <circle cx="550" cy="288" r="4" fill="#a78bfa"/>
  </g>

  <!-- Center IISc Branding Card -->
  <rect x="240" y="140" width="320" height="170" rx="16" fill="rgba(139, 92, 246, 0.08)" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="2" style="backdrop-filter: blur(10px);"/>

  <!-- IISc Emblem Representation -->
  <g transform="translate(376, 175) scale(1.6)" fill="#ffffff">
    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <text x="400" y="270" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" letter-spacing="1">IISC BANGALORE</text>
  <text x="400" y="292" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="13">Quantum & Neuromorphic AI Lab</text>
</svg>
