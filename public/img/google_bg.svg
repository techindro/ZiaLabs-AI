  <circle cx="400" cy="120" r="10" fill="#FBBC05"/>
  <circle cx="550" cy="200" r="8" fill="#34A853"/>
  <circle cx="680" cy="110" r="6" fill="#4285F4"/>
  <circle cx="350" cy="300" r="9" fill="#FBBC05"/>
