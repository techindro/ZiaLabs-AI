<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="g-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.8"/>
      <stop offset="33%" stop-color="#EA4335" stop-opacity="0.8"/>
      <stop offset="66%" stop-color="#FBBC05" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34A853" stop-opacity="0.8"/>
