<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="msft-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <radialGradient id="msft-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00A4EF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#msft-bg)"/>
  <circle cx="400" cy="225" r="280" fill="url(#msft-glow)"/>

  <!-- Azure Modern Grid -->
  <g opacity="0.12" stroke="#00A4EF" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Center Microsoft Branding Card -->
  <rect x="240" y="140" width="320" height="170" rx="16" fill="rgba(0, 164, 239, 0.06)" stroke="#00A4EF" stroke-opacity="0.4" stroke-width="2" style="backdrop-filter: blur(10px);"/>

  <g transform="translate(376, 175) scale(1.8)">
    <rect x="1" y="1" width="10.5" height="10.5" fill="#F25022"/>
    <rect x="12.5" y="1" width="10.5" height="10.5" fill="#7FBA00"/>
    <rect x="1" y="12.5" width="10.5" height="10.5" fill="#00A4EF"/>
    <rect x="12.5" y="12.5" width="10.5" height="10.5" fill="#FFB900"/>
  </g>

  <text x="400" y="270" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" letter-spacing="1">MICROSOFT RESEARCH</text>
  <text x="400" y="292" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="13">Small Models & Systematic AI</text>
</svg>
